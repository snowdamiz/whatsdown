name: Desktop build and release

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'mesh-private-messenger/apps/desktop/**'
      - 'mesh-private-messenger/apps/mobile/**'
      - 'mesh-private-messenger/packages/**'
  push:
    branches: [release]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '12.0'
  # The Tauri CLI parses CI as its --ci flag and accepts only true or false.
  CI: 'true'
  RELEASE_BUILD: ${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/desktop-v') }}

jobs:
  changes:
    name: Find what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node mesh-private-messenger/scripts/release-changes.mjs

  verification:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verification
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app bundle is kept beside the DMG so its signature and notarization
          # can be verified; with dmg alone Tauri deletes it after packaging.
          - os: macos-15
            platform: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos-x64
            bundles: app,dmg
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: mesh-private-messenger/apps/desktop
    env:
      MESH_LANG_REVISION: ${{ needs.verification.outputs.mesh-revision }}
      EXPO_PUBLIC_MESSENGER_BASE_URL: ${{ vars.EXPO_PUBLIC_MESSENGER_BASE_URL }}
      EXPO_PUBLIC_MESSENGER_PRIVACY_EDGE_URL: ${{ vars.EXPO_PUBLIC_MESSENGER_PRIVACY_EDGE_URL }}
      EXPO_PUBLIC_MESSENGER_STREAM_URL: ${{ vars.EXPO_PUBLIC_MESSENGER_STREAM_URL }}
      EXPO_PUBLIC_MESSENGER_OBJECT_URL: ${{ vars.EXPO_PUBLIC_MESSENGER_OBJECT_URL }}
      EXPO_PUBLIC_MESSENGER_OBJECT_WORK_DIFFICULTY: ${{ vars.EXPO_PUBLIC_MESSENGER_OBJECT_WORK_DIFFICULTY }}
      MESSENGER_TRANSPARENCY_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_TRANSPARENCY_PUBLIC_KEY_HEX }}
      MESSENGER_WITNESS_A_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_WITNESS_A_PUBLIC_KEY_HEX }}
      MESSENGER_WITNESS_B_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_WITNESS_B_PUBLIC_KEY_HEX }}
      MESSENGER_DELIVERY_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_DELIVERY_PUBLIC_KEY_HEX }}
      MESSENGER_ABUSE_DIFFICULTY: ${{ vars.MESSENGER_ABUSE_DIFFICULTY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: snowdamiz/mesh-lang
          ref: ${{ env.MESH_LANG_REVISION }}
          path: mesh-lang
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mesh-private-messenger/apps/mobile/package-lock.json
            mesh-private-messenger/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            mesh-lang -> target
            mesh-private-messenger/apps/desktop/src-tauri -> target
          key: desktop-${{ matrix.platform }}
      - name: Install application dependencies
        run: |
          npm ci --prefix ../mobile
          npm ci
          # The job's production endpoints and pins are for the native build; the
          # unit tests assume their local development defaults.
          for name in $(compgen -e | awk '/^(EXPO_PUBLIC_MESSENGER_|MESSENGER_)/'); do unset "$name"; done
          npm test --prefix ../mobile
          npm run typecheck --prefix ../mobile
          node --test scripts/*.test.mjs
      - name: Check release configuration and version
        if: env.RELEASE_BUILD == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { desktopConfig } from './scripts/config.mjs';
          desktopConfig(process.env);
          assert.ok(process.env.TAURI_SIGNING_PRIVATE_KEY?.trim(), 'Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret: installed apps only accept updates it signs');
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          if (process.env.GITHUB_REF.startsWith('refs/tags/desktop-v')) {
            assert.equal(process.env.GITHUB_REF_NAME, `desktop-v${version}`, 'Update both desktop versions before tagging');
          }
          assert.equal(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version, version);
          // Each release-branch push publishes its own patch version, so install.sh finds it as the newest.
          const release = process.env.GITHUB_REF === 'refs/heads/release'
            ? version.replace(/\d+$/, process.env.GITHUB_RUN_NUMBER) : version;
          fs.appendFileSync(process.env.GITHUB_ENV, `MORSE_VERSION=${release}\n`);
          NODE
      # Signing must not block releases yet: until WINDOWS_SIGN_COMMAND is set, Windows
      # installers ship unsigned. Setting it turns signing and its verification back on.
      - name: Configure Windows release signer
        if: runner.os == 'Windows' && env.RELEASE_BUILD == 'true' && vars.WINDOWS_SIGN_COMMAND != ''
        env:
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { windowsSigningConfig } from './scripts/config.mjs';
          writeFileSync(join(process.env.RUNNER_TEMP, 'windows-signing.json'), JSON.stringify(windowsSigningConfig(process.env)));
          NODE
      - name: Install LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 pkgconf openssl@3 zstd
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os == 'Windows'
        id: llvm
        with:
          path: ~/llvm
          key: desktop-llvm-21.1.8-windows-v1
      - name: Install LLVM on Windows
        if: runner.os == 'Windows' && steps.llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $llvmDir = "$env:USERPROFILE\llvm"
          $archive = "$env:RUNNER_TEMP\llvm.tar.xz"
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '749d22f565fcd5718dbed06512572d0e5353b502c03fe1f7f17ee8b8aca21a47') { throw 'LLVM checksum mismatch' }
          7z x $archive "-o$env:RUNNER_TEMP"
          7z x "$env:RUNNER_TEMP\llvm.tar" "-o$env:USERPROFILE"
          Rename-Item "$env:USERPROFILE\clang+llvm-21.1.8-x86_64-pc-windows-msvc" $llvmDir
          # Match the pinned Mesh Windows toolchain's rpmalloc compatibility fix.
          $work = "$env:RUNNER_TEMP\llvm-support"
          New-Item -ItemType Directory -Force $work | Out-Null
          Push-Location $work
          & "$llvmDir\bin\llvm-ar.exe" x "$llvmDir\lib\LLVMSupport.lib"
          Get-ChildItem '*rpmalloc*.obj' | Remove-Item
          Set-Content rpmalloc_stub.c 'void rpmalloc_linker_reference(void) {}'
          & "$llvmDir\bin\clang.exe" -c rpmalloc_stub.c -o rpmalloc_stub.obj
          Remove-Item "$llvmDir\lib\LLVMSupport.lib"
          $objects = (Get-ChildItem '*.obj').FullName
          & "$llvmDir\bin\llvm-ar.exe" rcs "$llvmDir\lib\LLVMSupport.lib" @objects
          Pop-Location
          vcpkg install libxml2:x64-windows-static
          $libs = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib"
          $xml = @('libxml2s.lib', 'libxml2.lib', 'xml2s.lib', 'xml2.lib') | ForEach-Object { Join-Path $libs $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $xml) { throw 'libxml2 library missing' }
          Copy-Item $xml "$llvmDir\lib\libxml2s.lib"
      - name: Configure Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LLVM_SYS_211_PREFIX=$env:USERPROFILE\llvm" >> $env:GITHUB_ENV
          "$env:USERPROFILE\llvm\bin" >> $env:GITHUB_PATH
      - name: Build the pinned Mesh compiler and runtime
        working-directory: mesh-lang
        run: |
          cargo build --locked -p mesh-rt
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Windows gives the main thread 1 MiB, and the debug compiler overflows
            # it on the mobile core (exit 0xC00000FD); macOS and Linux give 8 MiB.
            cargo rustc --locked -p meshc --bin meshc -- -C link-arg=/STACK:16777216
          else
            cargo build --locked -p meshc
          fi
      - name: Build native messenger library
        run: |
          if [[ "$RELEASE_BUILD" == true ]]; then
            npm run native
          else
            # PR previews use local endpoints and no production pins.
            for name in $(compgen -e | awk '/^(EXPO_PUBLIC_MESSENGER_|MESSENGER_)/'); do unset "$name"; done
            npm run native -- --development
          fi
      - name: Verify native bridge and networking boundaries
        run: |
          # generate_context! embeds the web bundle, so it must exist to compile.
          npm run web
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Import Mac release identity
        if: runner.os == 'macOS' && env.RELEASE_BUILD == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module -e "import { checkMacSigning } from './scripts/config.mjs'; checkMacSigning(process.env)"
          certificate="$RUNNER_TEMP/morse-signing.p12"
          keychain="$RUNNER_TEMP/morse-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          trap 'rm -f "$certificate"' EXIT
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Package installers
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.RELEASE_BUILD == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && env.RELEASE_BUILD == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && env.RELEASE_BUILD == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && env.RELEASE_BUILD == 'true' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE_BUILD == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE_BUILD == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ "$RELEASE_BUILD" != true ]]; then
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then unset "$name"; fi
          done
          # Releases also build the signed bundles that installed apps update from.
          version_config="$RUNNER_TEMP/version.json"
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}' "${MORSE_VERSION:-}" > "$version_config"
          if [[ -f "$RUNNER_TEMP/windows-signing.json" ]]; then
            npm run build -- --config "$RUNNER_TEMP/windows-signing.json" --config "$version_config" --bundles "$BUNDLES"
          elif [[ "$RELEASE_BUILD" == true ]]; then
            if [[ "$RUNNER_OS" == Windows ]]; then
              echo "::warning::WINDOWS_SIGN_COMMAND is not set; this Windows installer is unsigned"
            fi
            npm run build -- --config "$version_config" --bundles "$BUNDLES"
          else
            npm run build -- --debug --config '{"identifier":"io.morseapp.desktop.preview","productName":"Morse Preview"}' --bundles "$BUNDLES"
          fi
      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && env.RELEASE_BUILD == 'true' && vars.WINDOWS_SIGN_COMMAND != ''
        shell: pwsh
        env:
          WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNER_THUMBPRINT) {
              throw 'Installer signature is invalid or belongs to a different publisher'
            }
          }
      - name: Verify Mac signature and notarization ticket
        if: runner.os == 'macOS' && env.RELEASE_BUILD == 'true'
        run: |
          app_bundle="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          xcrun stapler validate "$app_bundle"
          spctl --assess --type execute --verbose "$app_bundle"
      # Both Mac builds make Morse.app.tar.gz; the release needs one per architecture.
      - name: Name the Mac update archive
        if: runner.os == 'macOS' && env.RELEASE_BUILD == 'true'
        working-directory: mesh-private-messenger/apps/desktop/src-tauri/target/release/bundle/macos
        run: |
          arch=$([[ "$(uname -m)" == arm64 ]] && echo aarch64 || echo x64)
          mv Morse.app.tar.gz "Morse_${MORSE_VERSION}_${arch}.app.tar.gz"
          mv Morse.app.tar.gz.sig "Morse_${MORSE_VERSION}_${arch}.app.tar.gz.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: morse-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            mesh-private-messenger/apps/desktop/src-tauri/target/*/bundle/dmg/*.dmg
            mesh-private-messenger/apps/desktop/src-tauri/target/*/bundle/macos/*.app.tar.gz*
            mesh-private-messenger/apps/desktop/src-tauri/target/*/bundle/nsis/*.exe
            mesh-private-messenger/apps/desktop/src-tauri/target/*/bundle/nsis/*.exe.sig
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && env.RELEASE_BUILD == 'true'
        run: |
          keychain="$RUNNER_TEMP/morse-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/morse-signing.p12"

  release:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build, verification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout empties a workspace that is not yet a repository, so it runs
      # before the installers are downloaded into it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: morse-*
          path: installers
          merge-multiple: true
      - name: Require verified candidate
        working-directory: .
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          VERIFIED_MORSE_REVISION: ${{ needs.verification.outputs.morse-revision }}
          VERIFIED_MESH_REVISION: ${{ needs.verification.outputs.mesh-revision }}
          # The build jobs compiled the installers with this commit.
          MESH_LANG_REVISION: ${{ needs.verification.outputs.mesh-revision }}
        run: node mesh-private-messenger/scripts/release-verification.mjs
      # install.sh and install.ps1 request exactly these names and refuse a download
      # without a matching SHA256SUMS entry, so a renamed installer fails here instead
      # of publishing a release the install commands cannot use.
      - name: Checksum the installers
        working-directory: installers
        run: |
          find . -mindepth 2 -type f -exec mv {} . \;
          # The builds stamped the release version into the installer names.
          set -- Morse_*_aarch64.dmg
          test "$#" -eq 1
          version="${1#Morse_}" && version="${version%_aarch64.dmg}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "desktop-v$version" = "$GITHUB_REF_NAME"; fi
          sha256sum "Morse_${version}_aarch64.dmg" "Morse_${version}_x64.dmg" "Morse_${version}_x64-setup.exe" > SHA256SUMS
          # Installed apps read latest.json from the newest release to find an update.
          node ../mesh-private-messenger/apps/desktop/scripts/updater-manifest.mjs . "$version"
          echo "MORSE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: desktop-v${{ env.MORSE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: installers/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
