name: Mobile release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      operation:
        description: What to release
        type: choice
        options: [staging, production, update]
        default: staging

permissions:
  contents: read

concurrency:
  group: mobile-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: mesh-private-messenger/apps/mobile

env:
  EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
  CI: '1'

jobs:
  changes:
    name: Find what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node mesh-private-messenger/scripts/release-changes.mjs

  verification:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/ci.yml

  verify:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mesh-private-messenger/apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check EAS project configuration
        run: |
          if [[ ! "$EXPO_PROJECT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo '::error::Set the EXPO_PROJECT_ID repository variable to the EAS project UUID.'
            exit 1
          fi

  build:
    needs: [verify, verification]
    # Pushes build the staging profile: internal-distribution builds on the production backend.
    if: github.ref == 'refs/heads/release' && inputs.operation != 'update'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # iOS staging waits for an ad hoc profile (RELEASING.md); production builds both.
        platform: ${{ fromJSON(inputs.operation == 'production' && '["ios","android"]' || '["android"]') }}
    env:
      PLATFORM: ${{ matrix.platform }}
      PROFILE: ${{ inputs.operation == 'production' && 'production' || 'staging' }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      MESH_LANG_REVISION: ${{ needs.verification.outputs.mesh-revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mesh-private-messenger/apps/mobile/package-lock.json
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: '24.7.0'
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - run: npm ci
      - name: Check TestFlight configuration
        if: matrix.platform == 'ios' && env.PROFILE == 'production' && env.ASC_APP_ID != ''
        run: |
          if [[ ! "$ASC_APP_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Create the app in App Store Connect and set the ASC_APP_ID repository variable.'
            exit 1
          fi
      - name: Require verified candidate
        working-directory: .
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          VERIFIED_MORSE_REVISION: ${{ needs.verification.outputs.morse-revision }}
          VERIFIED_MESH_REVISION: ${{ needs.verification.outputs.mesh-revision }}
        run: node mesh-private-messenger/scripts/release-verification.mjs
      - name: Check production configuration
        # Pull the same production values used by the remote build and OTA export.
        run: eas env:exec production 'node scripts/check-release-config.mjs' --non-interactive
      - name: Build with the verified Mesh release
        # The EAS worker compiles the native core with this profile's env, and
        # the fingerprint that OTA updates must match includes it.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const profile = config.build[process.env.PROFILE];
          profile.env = { ...profile.env, MESH_LANG_REVISION: process.env.MESH_LANG_REVISION,
            MORSE_RELEASE_REPOSITORY: process.env.GITHUB_REPOSITORY };
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Check worker disclosure export configuration
        id: plaintext_evidence
        run: node ../../scripts/plaintext-release.mjs configured
      - name: Wait for the native build
        run: |
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"
          jq -r '.[0] | "[\(.platform) \(.buildProfile) build](https://expo.dev/accounts/120356aa-user/projects/morse/builds/\(.id))"' "$RUNNER_TEMP/eas-build.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retrieve and verify disclosures for this exact EAS build and package
        if: steps.plaintext_evidence.outputs.enabled == 'true'
        run: |
          build_id="$(node ../../scripts/plaintext-release.mjs eas-id --build "$RUNNER_TEMP/eas-build.json")"
          eas build:view "$build_id" --json > "$RUNNER_TEMP/eas-build-view.json"
          node ../../scripts/plaintext-release.mjs retrieve-eas \
            --build "$RUNNER_TEMP/eas-build-view.json" --id "$build_id" \
            --output "$RUNNER_TEMP/plaintext-mobile"
          cat "$RUNNER_TEMP/plaintext-mobile/DISCLOSURES.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Record pending disclosure export for an unconfigured legacy worker
        if: steps.plaintext_evidence.outputs.enabled != 'true'
        run: |
          node ../../scripts/plaintext-release.mjs pending-eas \
            --build "$RUNNER_TEMP/eas-build.json" --output "$RUNNER_TEMP/plaintext-mobile"
          echo 'Disclosure publication is pending worker export configuration; no reviewed report is associated with this EAS package by this run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: plaintext_artifact
        if: always()
        with:
          name: morse-mobile-plaintext-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/plaintext-mobile/**
          if-no-files-found: error
          retention-days: 90
      - name: Associate retained disclosure evidence with build notes
        if: steps.plaintext_evidence.outputs.enabled == 'true' && steps.plaintext_artifact.outcome == 'success'
        env:
          DISCLOSURE_EVIDENCE_URL: ${{ steps.plaintext_artifact.outputs.artifact-url }}
        run: |
          printf '\n[Exact build disclosure evidence](%s)\n' "$DISCLOSURE_EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'MORSE_DISCLOSURE_NOTES=Reviewed Mesh disclosure inventory for source %s: %s . This is not a complete plaintext-source coverage claim.\n' "$GITHUB_SHA" "$DISCLOSURE_EVIDENCE_URL" >> "$GITHUB_ENV"
      - name: Submit this iOS build to TestFlight
        if: matrix.platform == 'ios' && env.PROFILE == 'production' && env.ASC_APP_ID != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          config.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
          NODE
          build_id="$(jq -er '.[0] | select(.platform == "IOS" and .status == "FINISHED") | .id' "$RUNNER_TEMP/eas-build.json")"
          disclosure_arguments=()
          if [[ -n "${MORSE_DISCLOSURE_NOTES:-}" ]]; then
            disclosure_arguments=(--what-to-test "$MORSE_DISCLOSURE_NOTES")
          fi
          eas submit --platform ios --profile production --id "$build_id" --non-interactive --wait "${disclosure_arguments[@]}"

  update:
    environment: ota-signing
    needs: [verify, verification]
    # Enable after upgrading the personal EAS account to a plan with code signing.
    if: vars.MORSE_OTA_ENABLED == 'true' && github.ref == 'refs/heads/release' && (github.event_name == 'push' || inputs.operation == 'update')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The update's runtime fingerprint includes the Mesh commit, so it must
      # be the one the native builds used.
      MESH_LANG_REVISION: ${{ needs.verification.outputs.mesh-revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mesh-private-messenger/apps/mobile/package-lock.json
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: '24.7.0'
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - run: npm ci
      - name: Require verified candidate
        working-directory: .
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          VERIFIED_MORSE_REVISION: ${{ needs.verification.outputs.morse-revision }}
          VERIFIED_MESH_REVISION: ${{ needs.verification.outputs.mesh-revision }}
        run: node mesh-private-messenger/scripts/release-verification.mjs
      - name: Check production configuration
        run: eas env:exec production 'node scripts/check-release-config.mjs' --non-interactive
      - name: Publish signed production OTA update
        env:
          MORSE_OTA_PRIVATE_KEY: ${{ secrets.MORSE_OTA_PRIVATE_KEY }}
        run: |
          test -n "$MORSE_OTA_PRIVATE_KEY"
          umask 077
          signing_key="$RUNNER_TEMP/morse-ota-key.pem"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$MORSE_OTA_PRIVATE_KEY" > "$signing_key"
          unset MORSE_OTA_PRIVATE_KEY
          eas update --channel production --environment production --platform all --message "$GITHUB_SHA" --private-key-path "$signing_key" --non-interactive
