name: Acceptance

# The witness network's bootstrap acceptance suite (plan §4.3), its alerting
# (§12) and the public status page, run against production. Everything is in
# mesh-private-messenger/ops/acceptance (README.md there lists each variable
# and secret). Scheduled and manual runs of the main repository only: never a
# fork, never a pull request.
on:
  schedule:
    - cron: '*/5 * * * *' # alerts
    - cron: '7 * * * *' # hourly: checks 1, 3, 4, 5, then the status page
    - cron: '20 10 * * 2' # weekly: check 2, the outage drill
    - cron: '30 12 * * 3' # weekly: check 8, credits
    - cron: '40 1 * * 4' # weekly: check 7, 100 minutes after the Thursday 00:00 UTC epoch boundary
    - cron: '0 11 3 * *' # monthly: check 6, the canary fork drill
  workflow_dispatch:
    inputs:
      checks:
        description: Checks to run, e.g. 1,3,4,5 (empty runs the alerts only)
        required: false
        default: '1,3,4,5'

permissions:
  contents: read

env:
  MORSE_DIRECTORY_URL: ${{ vars.MORSE_BACKEND_URL }}
  # The security config release builds pin, from the variables they build it from.
  MESSENGER_TRANSPARENCY_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_TRANSPARENCY_PUBLIC_KEY_HEX }}
  MESSENGER_WITNESS_A_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_WITNESS_A_PUBLIC_KEY_HEX }}
  MESSENGER_WITNESS_B_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_WITNESS_B_PUBLIC_KEY_HEX }}
  MESSENGER_DELIVERY_PUBLIC_KEY_HEX: ${{ vars.MESSENGER_DELIVERY_PUBLIC_KEY_HEX }}
  MESSENGER_ABUSE_DIFFICULTY: ${{ vars.MESSENGER_ABUSE_DIFFICULTY }}
  MESSENGER_WITNESSES: ${{ vars.MESSENGER_WITNESSES }}
  MESSENGER_ANCHOR: ${{ vars.MESSENGER_ANCHOR }}
  MESSENGER_RPC_URLS: ${{ vars.MESSENGER_RPC_URLS }}
  MESSENGER_RELAY_URLS: ${{ vars.MESSENGER_RELAY_URLS }}
  MESSENGER_CREDIT_ISSUER: ${{ vars.MESSENGER_CREDIT_ISSUER }}
  MESSENGER_LOG_ORIGIN: ${{ vars.MESSENGER_LOG_ORIGIN }}
  MESSENGER_MINIMUM_SUITE: ${{ vars.MESSENGER_MINIMUM_SUITE }}
  MESSENGER_OHTTP_KEY: ${{ vars.MESSENGER_OHTTP_KEY }}
  MESSENGER_OHTTP_RELAY: ${{ vars.MESSENGER_OHTTP_RELAY }}
  MORSE_MONITOR_STATUS_URL: ${{ vars.MORSE_MONITOR_STATUS_URL }}
  MORSE_REWARDS_PROGRAM: ${{ vars.MORSE_REWARDS_PROGRAM }}
  MORSE_CREDIT_ISSUER_HEALTH_URL: ${{ vars.MORSE_CREDIT_ISSUER_HEALTH_URL }}

jobs:
  plan:
    name: Pick the checks
    if: github.repository == 'snowdamiz/whatsdown'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      page: ${{ steps.plan.outputs.page }}
    steps:
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.checks }}
          EVENT: ${{ github.event_name }}
        run: |
          page=false
          case "$EVENT:$SCHEDULE" in
            'schedule:7 * * * *') checks=1,3,4,5 page=true ;;
            'schedule:20 10 * * 2') checks=2 ;;
            'schedule:30 12 * * 3') checks=8 ;;
            'schedule:40 1 * * 4') checks=7 ;;
            'schedule:0 11 3 * *') checks=6 ;;
            workflow_dispatch:*) checks=$INPUT page=true ;;
            *) checks= ;;
          esac
          if [ -n "$checks" ] && ! [[ "$checks" =~ ^[1-8](,[1-8])*$ ]]; then
            echo "::error::checks must look like 1,3,4,5"; exit 1
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "page=$page" >> "$GITHUB_OUTPUT"

  acceptance:
    name: Checks ${{ needs.plan.outputs.checks }}
    needs: plan
    if: needs.plan.outputs.checks != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: acceptance-${{ needs.plan.outputs.checks }}
      cancel-in-progress: false
    env:
      CHECKS: ${{ needs.plan.outputs.checks }}
      HAS_DRILL_SSH_KEY: ${{ secrets.MORSE_DRILL_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mesh-private-messenger/ops/cloudflare/package-lock.json
            mesh-private-messenger/ops/relay/package-lock.json
      - name: Install the chain client
        run: |
          npm ci --omit=dev --prefix mesh-private-messenger/ops/cloudflare
          if [[ ",$CHECKS," == *,6,* ]]; then npm ci --prefix mesh-private-messenger/ops/relay; fi

      # The canary device (checks 1, 2 and 4) is a Mesh program on the real
      # mobile core, built with the newest published Mesh release.
      - name: Install the newest Mesh release
        if: contains(needs.plan.outputs.checks, '1') || contains(needs.plan.outputs.checks, '2') || contains(needs.plan.outputs.checks, '4')
        run: |
          sudo apt-get update -q && sudo apt-get install --no-install-recommends -y -q libsqlite3-dev
          tag="$(node --input-type=module -e "import('./mesh-private-messenger/scripts/mesh-release.mjs').then((m) => m.latestReleaseTag()).then((tag) => console.log(tag))")"
          curl -sSfL "https://raw.githubusercontent.com/snowdamiz/mesh-lang/${tag}/tools/install/install.sh" \
            | sh -s -- --version "${tag#v}" --yes
          echo "MESHC=$HOME/.mesh/bin/meshc" >> "$GITHUB_ENV"

      # The outage drill: the alert runs meanwhile read this and expect the
      # drilled witness to be silent (and public /health to be 503) until then.
      - name: Announce the outage drill
        id: drill
        if: needs.plan.outputs.checks == '2'
        env:
          MORSE_DRILL_WITNESSES: ${{ vars.MORSE_DRILL_WITNESSES }}
        run: |
          witness="$(node mesh-private-messenger/ops/acceptance/run.mjs --drill-witness)"
          echo "witness=$witness" >> "$GITHUB_OUTPUT"
          node -e 'require("fs").writeFileSync("drill.json", JSON.stringify(process.argv[1] ? [{ witness_id: process.argv[1], until_ms: Date.now() + 50 * 60000 }] : []))' "$witness"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.drill.outputs.witness != ''
        with:
          path: drill.json
          key: acceptance-drill-${{ github.run_id }}-${{ github.run_attempt }}
      - name: SSH access for pull-mode drill targets
        if: needs.plan.outputs.checks == '2' && env.HAS_DRILL_SSH_KEY == 'true'
        env:
          SSH_KEY: ${{ secrets.MORSE_DRILL_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.MORSE_DRILL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run checks ${{ needs.plan.outputs.checks }}
        id: run
        env:
          MORSE_ACCEPTANCE_RPC: ${{ secrets.MORSE_ACCEPTANCE_RPC }}
          # 2: the outage drill
          MORSE_DRILL_WITNESSES: ${{ vars.MORSE_DRILL_WITNESSES }}
          MORSE_DRILL_WITNESS: ${{ steps.drill.outputs.witness }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MORSE_DRILL_CLOUDFLARE_API_TOKEN }}
          # 6: the canary fork drill (moves canary bond money; off unless MORSE_FORK_DRILL=on)
          MORSE_FORK_DRILL: ${{ vars.MORSE_FORK_DRILL }}
          MORSE_CANARY_RPC: ${{ secrets.MORSE_CANARY_RPC }}
          MORSE_CANARY_JUDGE: ${{ vars.MORSE_CANARY_JUDGE }}
          MORSE_CANARY_LOG: ${{ vars.MORSE_CANARY_LOG }}
          MORSE_CANARY_CLUSTER: ${{ vars.MORSE_CANARY_CLUSTER }}
          MORSE_CANARY_RELAY: ${{ vars.MORSE_CANARY_RELAY }}
          MORSE_CANARY_WITNESS: ${{ vars.MORSE_CANARY_WITNESS }}
          MORSE_CANARY_SERVICE_SEED_HEX: ${{ secrets.MORSE_CANARY_SERVICE_SEED_HEX }}
          MORSE_CANARY_WITNESS_SEED_HEX: ${{ secrets.MORSE_CANARY_WITNESS_SEED_HEX }}
          MORSE_CANARY_ANCHOR_KEYPAIR: ${{ secrets.MORSE_CANARY_ANCHOR_KEYPAIR }}
          MORSE_CANARY_PAYER_KEYPAIR: ${{ secrets.MORSE_CANARY_PAYER_KEYPAIR }}
          # 8: credits (spends money; off unless MORSE_CREDITS_DRILL=on)
          MORSE_CREDITS_DRILL: ${{ vars.MORSE_CREDITS_DRILL }}
          MORSE_CREDITS_EDGE_URL: ${{ vars.MORSE_EDGE_URL }}
          MORSE_CREDITS_BUYER_KEYPAIR: ${{ secrets.MORSE_CREDITS_BUYER_KEYPAIR }}
          MORSE_CREDITS_RPC: ${{ secrets.MORSE_CREDITS_RPC }}
        run: |
          set +e
          node mesh-private-messenger/ops/acceptance/run.mjs --checks "$CHECKS" --out results.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: acceptance-results
          path: results.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail on a failed check
        if: steps.run.outputs.code != '0'
        run: exit 1

  alerts:
    name: Alerts
    needs: [plan, acceptance]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: acceptance-alerts
      cancel-in-progress: false
    env:
      HAS_DATABASE: ${{ secrets.MORSE_ACCEPTANCE_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: mesh-private-messenger/ops/acceptance
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.acceptance.result != 'skipped'
        continue-on-error: true
        with:
          name: acceptance-results
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: alert-state.json
          key: acceptance-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: acceptance-alert-state-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: drill.json
          key: acceptance-drill-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: acceptance-drill-
      - name: Directory database size
        id: database
        if: env.HAS_DATABASE == 'true'
        env:
          DATABASE_URL: ${{ secrets.MORSE_ACCEPTANCE_DATABASE_URL }}
        run: echo "bytes=$(psql "$DATABASE_URL" -Atc 'SELECT pg_database_size(current_database())')" >> "$GITHUB_OUTPUT"
      - name: Evaluate and notify
        env:
          MORSE_ALERT_WEBHOOK: ${{ secrets.MORSE_ALERT_WEBHOOK }}
          MORSE_ALERT_FORMAT: ${{ vars.MORSE_ALERT_FORMAT }}
          MORSE_ALERT_ROUTING_KEY: ${{ secrets.MORSE_ALERT_ROUTING_KEY }}
          CONTACTS: ${{ secrets.MORSE_ALERT_CONTACTS_JSON }}
          DATABASE_BYTES: ${{ steps.database.outputs.bytes }}
        run: |
          if [ -n "$CONTACTS" ]; then printf '%s' "$CONTACTS" > "$RUNNER_TEMP/contacts.json"; else echo '{}' > "$RUNNER_TEMP/contacts.json"; fi
          node mesh-private-messenger/ops/acceptance/alerts.mjs --state alert-state.json --results results.json \
            --suppress drill.json --contacts "$RUNNER_TEMP/contacts.json" ${DATABASE_BYTES:+--database-bytes "$DATABASE_BYTES"}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: alert-state.json
          key: acceptance-alert-state-${{ github.run_id }}-${{ github.run_attempt }}

  status-page:
    name: Status page
    needs: [plan, acceptance]
    if: always() && needs.plan.outputs.page == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: acceptance-results
      # The published page's own JSON carries the history (slashes, burns,
      # attendance) forward from run to run.
      - name: Render
        env:
          PREVIOUS: ${{ vars.MORSE_STATUS_PAGE_URL }}
        run: |
          node mesh-private-messenger/ops/acceptance/status-page.mjs --out site --results results.json \
            ${PREVIOUS:+--previous "${PREVIOUS%/}/status.json"}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.MORSE_STATUS_PAGE == 'pages'
        with:
          path: site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: vars.MORSE_STATUS_PAGE != 'pages'
        with:
          name: status-page
          path: site
          retention-days: 30
      - name: Publish to R2
        if: vars.MORSE_STATUS_PAGE == 'r2'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MORSE_STATUS_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.MORSE_STATUS_R2_BUCKET }}
        run: |
          npm ci --prefix mesh-private-messenger/ops/cloudflare
          for file in index.html status.json; do
            type=$([ "$file" = index.html ] && echo 'text/html; charset=utf-8' || echo 'application/json')
            npx --prefix mesh-private-messenger/ops/cloudflare wrangler r2 object put "$BUCKET/$file" --file "site/$file" \
              --content-type "$type" --cache-control 'public, max-age=300' --remote
          done

  deploy-status-page:
    name: Deploy the status page
    needs: status-page
    if: vars.MORSE_STATUS_PAGE == 'pages' && needs.status-page.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
