name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MESH_LANG_REVISION: 4f06d63f8427d0f8dc0355d85657d6a9c7a570e0
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: mesh-lang

jobs:
  mesh:
    name: Pinned Mesh and messenger tests
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout Whatsdown
        uses: actions/checkout@v4

      - name: Checkout pinned Mesh
        uses: actions/checkout@v4
        with:
          repository: snowdamiz/mesh-lang
          ref: ${{ env.MESH_LANG_REVISION }}
          path: mesh-lang

      - name: Cache LLVM
        uses: actions/cache@v4
        id: cache-llvm
        with:
          path: ~/llvm
          key: llvm-21.1.8-v4-x86_64-unknown-linux-gnu

      - name: Install LLVM 21 (Linux x86_64)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          LLVM_VERSION="21.1.8"
          LLVM_ARCHIVE="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          curl -sSfL "$LLVM_URL" -o llvm.tar.xz
          mkdir -p "$HOME/llvm"
          tar xf llvm.tar.xz --strip-components=1 -C "$HOME/llvm"
          rm llvm.tar.xz

      - name: Set LLVM prefix
        run: echo "LLVM_SYS_211_PREFIX=$HOME/llvm" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,x86_64-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-mesh-x86_64-unknown-linux-gnu
          workspaces: mesh-lang -> target

      - name: Install M10 system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-dev sqlite3

      - name: Verify formatting and core workspace
        timeout-minutes: 45
        run: |
          cargo fmt --all -- --check
          cargo test -p mesh-parser --lib --locked
          cargo test -p mesh-typeck --lib --locked
          cargo test -p mesh-codegen --lib --locked
          cargo build --locked -p meshc -p mesh-rt -p mesh-test-rt

      - name: Verify Mesh messenger packages
        timeout-minutes: 20
        run: |
          ./target/debug/meshc fmt ../mesh-private-messenger/packages/messenger-protocol/groups --check
          ./target/debug/meshc fmt ../mesh-private-messenger/packages/messenger-protocol/tests --check
          ./target/debug/meshc test ../mesh-private-messenger/packages/messenger-protocol/tests
          ./target/debug/meshc fmt ../mesh-private-messenger/packages/mobile-core --check
          ../mesh-private-messenger/scripts/prove-m10.sh

      - name: Verify M13 transparency witness
        timeout-minutes: 15
        run: |
          bash -n ../mesh-private-messenger/scripts/prove-m13.sh
          ./target/debug/meshc fmt ../mesh-private-messenger/services/transparency-witness --check
          ../mesh-private-messenger/scripts/prove-m13.sh

      - name: Verify service startup failures
        timeout-minutes: 5
        run: |
          bash -n ../mesh-private-messenger/scripts/prove-service-startup.sh
          ../mesh-private-messenger/scripts/prove-service-startup.sh

      - name: Build Android mobile archives
        timeout-minutes: 35
        run: |
          mesh_workspace="$(pwd -P)"
          test "$mesh_workspace" = "$(cd "$GITHUB_WORKSPACE/mesh-lang" && pwd -P)"
          export CARGO_TARGET_DIR="$mesh_workspace/target"
          test -d "$CARGO_TARGET_DIR"
          test ! -L "$CARGO_TARGET_DIR"
          preserved_meshc="$RUNNER_TEMP/meshc"
          install -m 0755 "$CARGO_TARGET_DIR/debug/meshc" "$preserved_meshc"
          test -x "$preserved_meshc"
          NDK_BIN="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth 2 -maxdepth 2 -type d -name bin -print -quit)"
          test -n "$NDK_BIN"
          test -x "$NDK_BIN/aarch64-linux-android26-clang"
          test -x "$NDK_BIN/x86_64-linux-android26-clang"
          test -x "$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export CC_x86_64_linux_android="$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          cargo clean
          for target in aarch64-linux-android x86_64-linux-android; do
            case "$target" in
              aarch64-linux-android) abi=arm64-v8a ;;
              x86_64-linux-android) abi=x86_64 ;;
              *) exit 1 ;;
            esac
            output="../mesh-private-messenger/apps/mobile/modules/mesh-messenger/native/android/$abi/libmessenger_mobile.a"
            mkdir -p "$(dirname "$output")"
            cargo build --locked -p mesh-rt --lib --target "$target"
            "$preserved_meshc" build ../mesh-private-messenger/packages/mobile-core \
              --artifact staticlib --target "$target" --output "$output"
            test -s "$output"
            cargo clean --target "$target"
          done

      - name: Verify mobile application
        timeout-minutes: 15
        working-directory: mesh-private-messenger/apps/mobile
        run: |
          npm ci
          npm test
          npm run typecheck
