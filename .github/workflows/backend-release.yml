name: Backend release

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verification
    env:
      MESH_LANG_REVISION: ${{ needs.verification.outputs.mesh-revision }}
    name: Test and deploy Cloudflare backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morse_storage_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout verified Mesh commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: snowdamiz/mesh-lang
          ref: ${{ env.MESH_LANG_REVISION }}
          path: mesh-lang
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mesh-private-messenger/ops/cloudflare/package-lock.json
      - name: Prepare Linux build runner
        run: |
          # This backend-only job does not need the runner's Android SDK or .NET.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --no-install-recommends -y postgresql-client-17 libxml2-dev libffi-dev libsqlite3-dev
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          npm ci --prefix mesh-private-messenger/ops/cloudflare
      - name: Build the resolved compiler once for tests and deployment
        run: |
          docker build --target compiler-tools --output "type=local,dest=$RUNNER_TEMP/mesh-tools" \
            --build-arg "MESH_LANG_REVISION=$MESH_LANG_REVISION" \
            --file mesh-private-messenger/ops/cloudflare/Dockerfile .
          printf '%s\n' "MESHC=$RUNNER_TEMP/mesh-tools/meshc" \
            "MESH_RT_LIB_PATH=$RUNNER_TEMP/mesh-tools/libmesh_rt.a" \
            "MESH_TEST_RT_LIB_PATH=$RUNNER_TEMP/mesh-tools/libmesh_test_rt.a" >> "$GITHUB_ENV"
      - name: Verify backend behavior and event-driven processing
        env:
          MESSENGER_STORAGE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55439/morse_storage_test?sslmode=disable
        run: |
          "$MESHC" test mesh-private-messenger/packages/messenger-protocol/tests
          "$MESHC" test mesh-private-messenger/services/push-broker/tests
          "$MESHC" test mesh-private-messenger/services/object-store/tests/object_store.test.mpl
          "$MESHC" test mesh-private-messenger/services/object-store/tests/postgres.test.mpl
          npm test --prefix mesh-private-messenger/ops/cloudflare
      - name: Require verified candidate
        working-directory: .
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          VERIFIED_MORSE_REVISION: ${{ needs.verification.outputs.morse-revision }}
          VERIFIED_MESH_REVISION: ${{ needs.verification.outputs.mesh-revision }}
        run: node mesh-private-messenger/scripts/release-verification.mjs
      - name: Migrate and deploy all backend services
        working-directory: mesh-private-messenger/ops/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSENGER_DATABASE_URL: ${{ secrets.MESSENGER_DATABASE_URL }}
          MORSE_BACKEND_URL: ${{ vars.MORSE_BACKEND_URL }}
          MORSE_EDGE_URL: ${{ vars.MORSE_EDGE_URL }}
          WITNESS_A_URL: ${{ vars.WITNESS_A_URL }}
          WITNESS_B_URL: ${{ vars.WITNESS_B_URL }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          VERIFIED_MORSE_REVISION: ${{ needs.verification.outputs.morse-revision }}
          VERIFIED_MESH_REVISION: ${{ needs.verification.outputs.mesh-revision }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MESSENGER_DATABASE_URL MORSE_BACKEND_URL MORSE_EDGE_URL WITNESS_A_URL WITNESS_B_URL; do
            test -n "${!name}" || { echo "::error::Set $name for the production deployment"; exit 1; }
          done
          # The witnesses and privacy edge are separate Workers holding their own
          # secrets. They go first: the backend attests through the witnesses.
          MORSE_DIRECTORY_URL="$MORSE_BACKEND_URL" npm run deploy:witness-a -- --containers-rollout=immediate
          MORSE_DIRECTORY_URL="$MORSE_BACKEND_URL" npm run deploy:witness-b -- --containers-rollout=immediate
          MORSE_DELIVERY_URL="$MORSE_BACKEND_URL" npm run deploy:edge -- --containers-rollout=immediate
          node migrate.mjs
          npm run deploy -- --containers-rollout=immediate
          curl --fail --silent --show-error --retry 90 --retry-max-time 960 --retry-delay 10 --retry-all-errors --max-time 30 "$MORSE_BACKEND_URL/health"
          node smoke.mjs

  landing:
    name: Check and deploy landing page
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: mesh-private-messenger/apps/landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mesh-private-messenger/apps/mobile/package-lock.json
            mesh-private-messenger/ops/cloudflare/package-lock.json
      - name: Check the page
        run: |
          # check.mjs takes Playwright from the mobile app.
          npm ci --prefix ../mobile
          (cd ../mobile && npx playwright install --with-deps chromium)
          node check.mjs
      - name: Deploy the page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --prefix ../../ops/cloudflare
          ../../ops/cloudflare/node_modules/.bin/wrangler deploy
