plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.meshmessenger'
version = '0.1.0'

android {
  namespace 'expo.modules.meshmessenger'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    minSdk 23
    consumerProguardFiles 'wallet-consumer-rules.pro'
    ndk { abiFilters 'arm64-v8a', 'x86_64' }
    externalNativeBuild {
      cmake { cppFlags '-std=c++17' }
    }
  }

  sourceSets.main.java.srcDirs += [file('../generated')]
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }

  testBuildType 'release'
  testOptions { unitTests.includeAndroidResources = true }
  lintOptions { abortOnError false }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.biometric:biometric:1.1.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
  // Expo links expo-notifications as its prebuilt artifact, not a Gradle project.
  implementation 'host.exp.exponent:expo.modules.notifications:58.1.5'
  api 'com.google.firebase:firebase-messaging:25.0.1'
}
