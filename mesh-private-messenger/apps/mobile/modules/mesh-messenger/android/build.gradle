plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.meshmessenger'
version = '0.1.0'

android {
  namespace 'expo.modules.meshmessenger'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    minSdk 23
    ndk { abiFilters 'arm64-v8a', 'x86_64' }
    externalNativeBuild {
      cmake { cppFlags '-std=c++17' }
    }
  }

  sourceSets.main.java.srcDirs += [file('../generated')]
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }

  lintOptions { abortOnError false }
}
