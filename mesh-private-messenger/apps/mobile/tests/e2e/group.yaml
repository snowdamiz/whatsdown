appId: io.morseapp
---
- launchApp
- extendedWaitUntil:
    visible: "New conversation"
    timeout: 30000
- tapOn:
    id: "tab-groups"
- tapOn: "Create group"
- tapOn:
    id: "Group name"
- inputText: "Weekend walks"
- tapOn: "Create group"
- extendedWaitUntil:
    visible: "Group details"
    timeout: 30000
- takeScreenshot: empty-group
- assertVisible: "Invite someone"
- assertVisible: "Send group invitation"
- assertVisible: "You"
- assertVisible: "Created the group"
- tapOn: "Back"
- tapOn:
    id: "Group message"
- inputText: "Welcome to the new Morse."
- assertVisible:
    text: "Send"
    enabled: false
- takeScreenshot: group-awaiting-member
- tapOn: "Back to groups"
- tapOn: "Join with QR"
- extendedWaitUntil:
    visible: "You’re invited."
    timeout: 15000
- takeScreenshot: group-invitation
- tapOn: "Back"
- tapOn:
    id: "tab-home"
