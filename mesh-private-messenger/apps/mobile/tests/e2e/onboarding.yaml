appId: io.morseapp
---
# Run on a fresh simulator; this flow never deletes an existing identity.
- launchApp
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "Create account"
- assertVisible: "Use 3–32 lowercase letters, numbers, or underscores."
- tapOn: "Link an existing account"
- extendedWaitUntil:
    visible: "Scan the approval code"
    timeout: 30000
- tapOn: "Scan the approval code"
- assertVisible: "Cancel scan"
- tapOn: "Cancel scan"
- assertVisible: "Scan the approval code"
- tapOn: "Cancel"
- assertVisible: "Create account"
