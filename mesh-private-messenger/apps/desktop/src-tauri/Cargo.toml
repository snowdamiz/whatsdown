[package]
name = "morse-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Morse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
morse-wallet-core = { path = "../../../packages/wallet-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
libloading = "0.8"
base64 = "0.22.1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_Security", "Win32_Security_Authorization"] }

[profile.release]
strip = true
lto = "thin"
