services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_USER: messenger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - messenger-postgres:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro

volumes:
  messenger-postgres:
