services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_USER: messenger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U messenger -d messenger"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:${MESSENGER_POSTGRES_PORT:-55432}:5432"
    volumes:
      - messenger-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  messenger-postgres:
