[package]
name = "morse-wallet-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[workspace]

[dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "zeroize"] }
getrandom = "=0.3.4"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
zeroize = "=1.8.2"
subtle = "=2.6.1"
solana-address = { version = "=2.9.0", default-features = false, features = ["std", "curve25519", "copy"] }
solana-hash = { version = "=4.6.0", default-features = false }
solana-instruction = { version = "=3.5.1", default-features = false, features = ["std"] }
solana-message = { version = "=4.6.0", features = ["wincode"] }

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.145"
tempfile = "=3.23.0"
