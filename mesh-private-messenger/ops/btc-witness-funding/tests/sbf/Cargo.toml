[package]
name = "morse-btc-witness-funding-proof"
version = "0.1.0"
edition = "2021"
[workspace]
[dev-dependencies]
base64 = "=0.22.1"
serde_json = "=1.0.151"
hex = "=0.4.3"
wincode = "=0.6.2"
litesvm = { version = "=0.17.0", features = ["precompiles", "serde"] }
solana-address = "=2.7.0"
solana-instruction = "=3.5.0"
solana-keypair = "=3.1.2"
solana-message = { version = "=4.6.0", features = ["wincode"] }
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.3.0", features = ["wincode"] }
solana-account = "=4.7.0"
solana-clock = "=3.2.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
