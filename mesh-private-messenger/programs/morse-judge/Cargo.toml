[package]
name = "morse-judge"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
morse-token = { path = "../morse-token" }
base64 = { version = "=0.22.1", default-features = false }
pinocchio = { version = "=0.11.2", default-features = false, features = ["cpi", "account-resize"] }
pinocchio-system = "=0.6.1"
pinocchio-token = "=0.7.0"
pinocchio-associated-token-account = "=0.4.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "=2.7.0", features = ["curve25519"] }

[dev-dependencies]
bincode = "=1.3.3"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
serde_json = "=1.0.151"
litesvm = { version = "=0.17.0", features = ["precompiles"] }
solana-address = "=2.7.0"
solana-instruction = "=3.5.0"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.3.0", features = ["serde"] }
solana-account = "=4.7.0"
solana-clock = "=3.2.0"
solana-slot-hashes = "=3.2.0"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode"] }
solana-compute-budget-interface = "=3.1.0"

[features]
svm = []

[[example]]
name = "anchor_writer_bridge"
required-features = ["svm"]

[[example]]
name = "relay_writer_bridge"
required-features = ["svm"]

[[test]]
name = "introspection_svm"
required-features = ["svm"]

[[test]]
name = "anchor_svm"
required-features = ["svm"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[[test]]
name = "stage_svm"
required-features = ["svm"]

[[test]]
name = "custody_svm"
required-features = ["svm"]

[[test]]
name = "adjudication_svm"
required-features = ["svm"]

[[test]]
name = "token_custody_svm"
required-features = ["svm"]
