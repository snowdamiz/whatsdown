[package]
name = "morse-rewards-program"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "morse_rewards"
crate-type = ["cdylib"]

[dependencies]
rewards-core = { package = "morse-rewards", path = "../morse-rewards" }
pinocchio = { version = "=0.11.2", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
