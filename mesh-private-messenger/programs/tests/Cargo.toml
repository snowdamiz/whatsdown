[package]
name = "morse-program-tests"
version = "0.0.0"
edition = "2021"
publish = false
description = "LiteSVM tests for morse-judge and morse-rewards, run against the built .so files"

[dependencies]
morse-rewards = { path = "../morse-rewards" }
litesvm = { version = "0.16", features = ["precompiles"] }
solana-account = "4"
solana-address = { version = "2.6", features = ["curve25519", "decode"] }
solana-clock = "3"
solana-instruction = "3"
solana-instruction-error = "2"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = { version = "4", features = ["serde"] }
solana-transaction-error = "3"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
base64 = "0.22"
bincode = "1"
ureq = { version = "3", features = ["json"] }
solana-hash = { version = "4", features = ["decode"] }
bs58 = "0.5"
